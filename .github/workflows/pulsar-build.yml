name: Pulsar Engine Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK r21e é a versão recomendada pelo Lime. Se o build reclamar do NDK, é aqui que se muda.
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Instalar dependências Haxe (setup/unix.sh do fork)
        run: |
          haxelib setup ~/haxelib
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
          haxelib install extension-androidtools 2.2.2

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.setup-ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compilar
        run: haxelib run lime build Project.xml android -final

      - uses: actions/upload-artifact@v4
        with:
          name: PulsarEngine-android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev
          haxelib setup ~/haxelib
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
          haxelib install extension-androidtools 2.2.2

      - name: Compilar
        run: haxelib run lime build Project.xml linux -final

      - uses: actions/upload-artifact@v4
        with:
          name: PulsarEngine-linux
          path: export/release/linux/bin
          if-no-files-found: error

  windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Instalar dependências
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          .\"setup/windows.bat"

      - name: Compilar
        run: haxelib run lime build Project.xml windows -final

      - uses: actions/upload-artifact@v4
        with:
          name: PulsarEngine-windows
          path: export/release/windows/bin
          if-no-files-found: error
